<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Advisor</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      /* The host frames every UI block in a tinted, rounded box. Painting the
         chat background over it leaves the plain line this card is meant to be,
         and makes the frame invisible once the card is empty or dismissed. */
      body {
        color: var(--oc-fg);
        background: var(--oc-bg, transparent);
        font-family: var(--oc-font);
      }
      #root {
        box-sizing: border-box;
        padding: 0;
      }
      .next-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 0 4px;
      }
      .next-text {
        flex: 1;
        min-width: 0;
        margin: 0;
        color: var(--oc-muted);
        font-size: 0.875rem;
        font-weight: 400;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .next-actions {
        display: flex;
        align-items: center;
        gap: 2px;
        flex: none;
      }
      .next-icon {
        display: inline-flex;
      }
      .oc-sdk-btn.next-icon-btn {
        width: 28px;
        height: 28px;
        padding: 0;
        border-radius: 8px;
        color: var(--oc-muted);
        background: transparent;
      }
      .oc-sdk-btn.next-icon-btn:hover {
        color: var(--oc-fg);
        background: var(--oc-hover);
      }
      .oc-sdk-btn.next-icon-btn:focus-visible {
        outline: 2px solid var(--oc-focus);
        outline-offset: 1px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
