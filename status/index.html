<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Advisor</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        color: var(--oc-fg);
        background: transparent;
      }
      #root {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px 12px;
      }
      .status-count {
        color: var(--oc-muted);
        font-size: 0.8125rem;
      }
      .status-empty {
        margin: 0;
        color: var(--oc-muted);
      }
      .status-advice {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        border: 1px solid var(--oc-border);
        border-radius: var(--oc-radius, 8px);
      }
      .status-meta {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .status-time {
        color: var(--oc-muted);
        font-size: 0.8125rem;
      }
      .status-note {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .status-actions {
        display: flex;
        gap: 6px;
      }
      .status-suggestion {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 10px;
        border: 1px solid var(--oc-border);
        border-radius: var(--oc-radius);
        background: var(--oc-muted);
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
