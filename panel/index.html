<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Advisor</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        color: var(--oc-fg);
        background: transparent;
      }
      #root {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 12px;
      }
      .advisor-body {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .advisor-pane {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .advisor-pane[hidden] {
        display: none;
      }
      .advisor-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .advisor-journal {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .advisor-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        border: 1px solid var(--oc-border);
        border-radius: var(--oc-radius, 8px);
      }
      .advisor-meta {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .advisor-time {
        color: var(--oc-muted);
        font-size: 0.8125rem;
      }
      .advisor-note {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .advisor-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .advisor-status {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .advisor-status-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .advisor-status-key {
        color: var(--oc-muted);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
